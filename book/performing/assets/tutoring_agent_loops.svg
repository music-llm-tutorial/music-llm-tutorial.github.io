<svg xmlns="http://www.w3.org/2000/svg" width="900" height="336" viewBox="0 0 900 336" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="336" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1b1b"/></marker></defs>
<rect x="36" y="40" width="828" height="226" rx="6" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.3"/>
<text x="58" y="70" font-size="13" fill="#1b1b1b" font-weight="700" font-style="normal">OUTER LOOP</text>
<text x="164" y="70" font-size="11.5" fill="#6b6b6b" font-weight="400" font-style="normal">runs once per task</text>
<text x="58" y="96" font-size="11.5" fill="#6b6b6b" font-weight="600" font-style="normal">tutoring systems</text>
<text x="178" y="96" font-size="12.5" fill="#1b1b1b" font-weight="400" font-style="normal">choose what the student works on next</text>
<text x="58" y="118" font-size="11.5" fill="#6b6b6b" font-weight="600" font-style="normal">agent harness</text>
<text x="178" y="118" font-size="12.5" fill="#1b1b1b" font-weight="400" font-style="normal">task loop: pick the next unit of work</text>
<rect x="76" y="140" width="748" height="104" rx="6" fill="#eeeeee" stroke="#1b1b1b" stroke-width="1.3"/>
<text x="98" y="168" font-size="13" fill="#1b1b1b" font-weight="700" font-style="normal">INNER LOOP</text>
<text x="204" y="168" font-size="11.5" fill="#6b6b6b" font-weight="400" font-style="normal">runs once per step</text>
<text x="98" y="194" font-size="11.5" fill="#6b6b6b" font-weight="600" font-style="normal">tutoring systems</text>
<text x="218" y="194" font-size="12.5" fill="#1b1b1b" font-weight="400" font-style="normal">hint, feedback, update the student model</text>
<text x="98" y="216" font-size="11.5" fill="#6b6b6b" font-weight="600" font-style="normal">agent harness</text>
<text x="218" y="216" font-size="12.5" fill="#1b1b1b" font-weight="400" font-style="normal">turn loop: one model request and its tool calls</text>
<line x1="36" y1="292" x2="864" y2="292" stroke="#c9c9c9" stroke-width="1"/>
<text x="36" y="316" font-size="12.5" fill="#1b1b1b" font-weight="600" font-style="normal">In a practice agent:</text>
<text x="164" y="316" font-size="12.5" fill="#6b6b6b" font-weight="400" font-style="normal">which passage to work on next is an outer loop decision;  how much to say about one take is an inner loop decision.</text>
</svg>