<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1b1b"/></marker></defs>
<text x="30" y="38" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700" font-style="normal">WRITE</text>
<text x="96" y="38" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" font-style="normal">after the session ends, two model calls</text>
<rect x="30" y="66" width="150" height="54" rx="6" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="1.3"/>
<text x="105.0" y="97.5" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">session log</text>
<rect x="225" y="66" width="150" height="54" rx="6" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="1.3"/>
<text x="300.0" y="89.2" font-size="12" font-weight="400" fill="#1b1b1b" text-anchor="middle">extract</text>
<text x="300.0" y="105.2" font-size="12" font-weight="400" fill="#1b1b1b" text-anchor="middle">one record per session</text>
<rect x="420" y="66" width="150" height="54" rx="6" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="1.3"/>
<text x="495.0" y="89.2" font-size="12" font-weight="400" fill="#1b1b1b" text-anchor="middle">consolidate</text>
<text x="495.0" y="105.2" font-size="12" font-weight="400" fill="#1b1b1b" text-anchor="middle">rewrite the profile</text>
<rect x="615" y="66" width="150" height="54" rx="6" fill="#e9e9e9" stroke="#1b1b1b" stroke-width="1.3"/>
<text x="690.0" y="97.5" font-size="13" font-weight="600" fill="#1b1b1b" text-anchor="middle">learner profile</text>
<line x1="180" y1="93.0" x2="219" y2="93.0" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="375" y1="93.0" x2="414" y2="93.0" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="570" y1="93.0" x2="609" y2="93.0" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="300.0" y="137" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" font-style="normal">model call, one per past session</text>
<text x="495.0" y="137" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" font-style="normal">model call, serialised, sees a diff</text>
<text x="690.0" y="56" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" font-style="normal">bounded size</text>
<line x1="30" y1="188" x2="870" y2="188" stroke="#c9c9c9" stroke-width="1"/>
<text x="30" y="212" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700" font-style="normal">READ</text>
<text x="92" y="212" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" font-style="normal">at session start, no model call</text>
<rect x="615" y="218" width="150" height="54" rx="6" fill="#e9e9e9" stroke="#1b1b1b" stroke-width="1.3"/>
<text x="690.0" y="249.6" font-size="13" font-weight="600" fill="#1b1b1b" text-anchor="middle">learner profile</text>
<rect x="225" y="218" width="195" height="54" rx="6" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="1.3"/>
<text x="322.5" y="249.6" font-size="13" font-weight="400" fill="#1b1b1b" text-anchor="middle">session prompt</text>
<line x1="609" y1="245.0" x2="426" y2="245.0" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="690.0" y1="120" x2="690.0" y2="218" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="517.5" y="235.0" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" font-style="normal">injected as text</text>
<text x="30" y="312" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" font-style="normal">A wrong claim enters on the write path and is re-read on every later session. Nothing downstream re-examines it.</text>
</svg>