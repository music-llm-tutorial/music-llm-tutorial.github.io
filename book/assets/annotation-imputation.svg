<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 796 320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Expanding the tags of MagnaTagATune</title>
<desc id="d">Three rows. Sorting the tags: raw MagnaTagATune tags such as man, male vocals, soft rock and sitar become column values (genre soft rock, instrument sitar, vocal male vocal); the negative tag no flute is dropped, and mood stays empty. Describing, then proposing values: the audio LLM first writes a description of the clip from the audio, and the description is then turned into values: instrument guitar, mood warm, usage road trip. Expanding the tags: the tag values are kept, the model's values are added next to them (instrument becomes sitar and guitar, mood becomes warm), and usage is a new column filled by the model. The values are illustrative.</desc>
<rect x="480" y="4" width="14" height="12" rx="3" fill="#77726a" fill-opacity="0.08" stroke="#77726a" stroke-opacity="0.6"/>
<text x="500" y="14" font-size="11.5" fill="#77726a">from the tags</text>
<rect x="605.7" y="4" width="14" height="12" rx="3" fill="#ab7827" fill-opacity="0.28" stroke="#ab7827" stroke-opacity="0.6"/>
<text x="625.7" y="14" font-size="11.5" fill="#77726a">generated</text>
<rect x="705.7" y="4" width="14" height="12" rx="3" fill="none" stroke="#77726a" stroke-opacity="0.6" stroke-dasharray="3 3"/>
<text x="725.7" y="14" font-size="11.5" fill="#77726a">empty</text>
