<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 786 376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Annotation, search/retrieval, and recommendation: previous approaches</title>
<desc id="d">Three columns, one per task, as solved by previous approaches. Annotation by tagging: a tagger scores an audio track against a fixed vocabulary (jazz 0.91, piano 0.84, instrumental 0.78, vocals 0.05, rock 0.02) and writes the top tags as information. Search/retrieval by joint text-audio embedding: a text encoder and an audio encoder place the query "late-night drive in the rain" and every track in one shared space, and the nearest tracks are returned. Recommendation by matrix factorization: the user-by-track play matrix is approximated by user vectors times track vectors, and the missing cells in user 1024's row are scored to pick the next track.</desc>
