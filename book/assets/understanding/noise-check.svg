<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 788 430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Accuracy with real audio and with noise</title>
<desc id="d">Dumbbell chart of multiple-choice accuracy with the real audio and with noise in its place. MMAU-Pro, random guessing 23.4%: Qwen2.5-Omni-7B 52.2 real, 30.6 noise; Audio Flamingo 3 51.7, 47.2; Qwen2.5-Omni-3B 46.1, 31.3; Phi4-MM-Instruct 38.7, 34.9. HumMusQA, chance 25%: Qwen2.5-Omni-7B 64.3, 46.2; Music Flamingo 58.5, 42.9; Gemini 2.5 Flash 55.9, 37.8. MuChoMusic in the RUListening study, chance 25%: Qwen2-Audio 61.5, 43.2; Audio Flamingo 2 56.5, 46.9; Qwen-Audio 51.4, 34.6. Every model drops with noise, and every model stays above chance with noise.</desc>
