[fill="#607b9a"] { fill: #8297af } [stroke="#607b9a"] { stroke: #8297af }
[fill="#ab7827"] { fill: #d9aa57 } [stroke="#ab7827"] { stroke: #d9aa57 }
[fill="#7b7c55"], [fill="#8f9066"] { fill: #6f9363 } [stroke="#8f9066"] { stroke: #6f9363 }
[fill-opacity="0.14"] { fill-opacity: 0.2 }
}</style>
