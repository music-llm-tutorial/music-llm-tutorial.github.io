<text x="407" y="108" font-size="12" font-weight="600" text-anchor="middle" fill="#607b9a">A4</text>
<rect x="382" y="128" width="50" height="34" rx="3" fill="#607b9a" fill-opacity="0.1" stroke="#607b9a" stroke-opacity="0.7" stroke-width="1"/>
