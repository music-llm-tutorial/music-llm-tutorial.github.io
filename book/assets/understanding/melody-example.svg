<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 788 328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Perception and reasoning in one question</title>
<desc id="d">The question 'What is the melody here?' on the reel splits into two steps. Perception: write down what sounds on each beat of bar 1, upper line D5, F#5 D5, A4, F#4 A4 and lower line D3, A3, D3, A3. Reasoning: the upper line is higher and moves in eighth notes, while the lower line repeats D and A once per beat, so the melody is the upper line, d2fd A2FA. A perception error, such as mishearing a note, gives a wrong answer even when the reasoning is sound. A reasoning error, such as naming the bass line, gives a wrong answer even when every note was heard correctly.</desc>
