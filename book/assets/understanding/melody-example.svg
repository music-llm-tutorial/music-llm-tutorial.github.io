<text x="214" y="26" font-size="15" font-weight="700" text-anchor="start" fill="#607b9a">1  Perception</text>
<text x="214" y="46" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">what sounds on each beat (bar 1)</text>
<text x="294" y="76" font-size="12" font-weight="600" text-anchor="middle" fill="#607b9a">1</text>
<rect x="270" y="86" width="50" height="34" rx="3" fill="#607b9a" fill-opacity="0.1" stroke="#607b9a" stroke-opacity="0.7" stroke-width="1"/>
