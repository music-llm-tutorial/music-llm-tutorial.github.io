<text x="462" y="76" font-size="12" font-weight="600" text-anchor="middle" fill="#607b9a">4</text>
<rect x="438" y="86" width="50" height="34" rx="3" fill="#607b9a" fill-opacity="0.1" stroke="#607b9a" stroke-opacity="0.7" stroke-width="1"/>
<text x="463" y="108" font-size="12" font-weight="600" text-anchor="middle" fill="#607b9a">F♯4 A4</text>
<rect x="438" y="128" width="50" height="34" rx="3" fill="#607b9a" fill-opacity="0.1" stroke="#607b9a" stroke-opacity="0.7" stroke-width="1"/>
<text x="463" y="150" font-size="12" font-weight="600" text-anchor="middle" fill="#607b9a">A3</text>
<text x="214" y="108" font-size="12" font-weight="600" text-anchor="start" fill="#977a5d">upper</text>
<text x="214" y="150" font-size="12" font-weight="600" text-anchor="start" fill="#977a5d">lower</text>
<text x="214" y="186" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d" font-style="italic">audio LLM: from the signal; ABC: already written</text>
<line x1="504" y1="100" x2="536" y2="100" stroke="#ab7827" stroke-width="1.6" stroke-opacity="1" marker-end="url(#ah-ab7827)"/>
<rect x="540" y="0" width="240" height="200" rx="10" fill="#ab7827" fill-opacity="0.08" stroke="#ab7827" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="554" y="26" font-size="15" font-weight="700" text-anchor="start" fill="#ab7827">2  Reasoning</text>
<text x="554" y="52" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">upper line: higher, moves</text>
<text x="554" y="70" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">in eighth notes</text>
<text x="554" y="88" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">lower line: repeats D–A,</text>
<text x="554" y="106" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">one note per beat</text>
<text x="554" y="124" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">→ the melody is the upper line</text>
<text x="554" y="156" font-size="12" font-weight="600" text-anchor="start" fill="#ab7827">answer</text>
<text x="554" y="180" font-size="13" font-weight="600" text-anchor="start" fill="#ab7827" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">d2fd A2FA | d2fd e2cA</text>
<rect x="0" y="222" width="380" height="98" rx="10" fill="#607b9a" fill-opacity="0.04" stroke="#607b9a" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="14" y="246" font-size="14" font-weight="700" text-anchor="start" fill="#607b9a">Perception error</text>
<text x="14" y="268" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">a mishearing (say, F♯5 heard as G5) gives a wrong</text>
<text x="14" y="286" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">answer even if the reasoning is sound</text>
<rect x="400" y="222" width="380" height="98" rx="10" fill="#ab7827" fill-opacity="0.04" stroke="#ab7827" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="414" y="246" font-size="14" font-weight="700" text-anchor="start" fill="#ab7827">Reasoning error</text>
<text x="414" y="268" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">every note heard correctly, but the model</text>
<text x="414" y="286" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">names the bass line as the melody</text>
</svg>
