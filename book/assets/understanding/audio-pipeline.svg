<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 788 294" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">From waveform to LLM</title>
<desc id="d">Stages between a waveform and the LLM, with three example models. Stages: waveform; an optional pre-transform with no learned weights; a learned encoder; its output, continuous vectors or discrete codes; an adapter; the LLM. Qwen2-Audio: 16 kHz waveform, 128-band log-mel spectrogram, Whisper-based encoder, vectors at 25 per second, a linear layer, Qwen-7B. AnyGPT for music: 32 kHz waveform, no pre-transform, EnCodec encoder with residual vector quantization, four codes per frame at 50 frames per second, new rows in the embedding table, LLaMA-2 7B. Gemma 4 12B: 16 kHz waveform cut into 40 ms chunks, no learned encoder, 640 numbers per chunk, projected directly into the LLM.</desc>
