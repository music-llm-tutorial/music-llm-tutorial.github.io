<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 788 338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Where the audio encoder comes from</title>
<desc id="d">Three columns. Borrowed encoders: Whisper, trained for speech recognition on 680,000 hours, used by Qwen2-Audio and SALMONN; MERT, self-supervised on music, used by MusiLingo and MU-LLaMA; Jukebox, a music generation model, used by LLark; CLAP, trained to match audio and text, retrained as AF-CLAP for Audio Flamingo 2. Encoders trained for the LLM: AF-Whisper in Audio Flamingo 3, which starts from Whisper large-v3 and is trained on audio captions; AuT in Qwen3-Omni, trained from scratch on 20 million hours and producing 12.5 tokens per second. No encoder: Gemma 4 12B cuts 16 kHz audio into 40 ms chunks of 640 numbers and projects them directly; Inkling feeds dMel spectrogram features through a light-weight embedding layer. An arrow below runs from reusing outside knowledge to making fewer fixed choices about the input.</desc>
