}</style>
<defs><marker id="ah-607b9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607b9a"/></marker><marker id="ah-8f9066" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f9066"/></marker><marker id="ah-977a5d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#977a5d"/></marker><marker id="ah-ab7827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ab7827"/></marker></defs>
<rect x="0" y="0" width="240" height="274" rx="10" fill="#607b9a" fill-opacity="0.08" stroke="#607b9a" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="14" y="26" font-size="15" font-weight="700" text-anchor="start" fill="#607b9a">Borrowed encoder</text>
<text x="14" y="54" font-size="14" font-weight="700" text-anchor="start" fill="#607b9a">Whisper</text>
<text x="14" y="72" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">speech recognition, 680k hours</text>
<text x="14" y="88" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">Qwen2-Audio, SALMONN</text>
<text x="14" y="110" font-size="14" font-weight="700" text-anchor="start" fill="#607b9a">MERT</text>
<text x="14" y="128" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">self-supervised on music</text>
<text x="14" y="144" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">MusiLingo, MU-LLaMA</text>
<text x="14" y="166" font-size="14" font-weight="700" text-anchor="start" fill="#607b9a">Jukebox</text>
<text x="14" y="184" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">music generation model</text>
<text x="14" y="200" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">LLark</text>
<text x="14" y="222" font-size="14" font-weight="700" text-anchor="start" fill="#607b9a">CLAP</text>
<text x="14" y="240" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">matches audio and text</text>
<text x="14" y="256" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">Audio Flamingo 2 (AF-CLAP)</text>
<rect x="270" y="0" width="240" height="274" rx="10" fill="#ab7827" fill-opacity="0.08" stroke="#ab7827" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="284" y="26" font-size="15" font-weight="700" text-anchor="start" fill="#ab7827">Trained for the LLM</text>
<text x="284" y="54" font-size="14" font-weight="700" text-anchor="start" fill="#ab7827">AF-Whisper</text>
<text x="284" y="72" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">from Whisper large-v3,</text>
<text x="284" y="88" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">trained on audio captions</text>
<text x="284" y="106" font-size="12" font-weight="600" text-anchor="start" fill="#ab7827">→ Audio Flamingo 3</text>
<text x="284" y="128" font-size="14" font-weight="700" text-anchor="start" fill="#ab7827">AuT</text>
<text x="284" y="146" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">from scratch, 20M hours,</text>
<text x="284" y="162" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">12.5 tokens per second</text>
<text x="284" y="180" font-size="12" font-weight="600" text-anchor="start" fill="#ab7827">→ Qwen3-Omni</text>
<rect x="540" y="0" width="240" height="274" rx="10" fill="#8f9066" fill-opacity="0.08" stroke="#8f9066" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="554" y="26" font-size="15" font-weight="700" text-anchor="start" fill="#7b7c55">No encoder</text>
<text x="554" y="54" font-size="14" font-weight="700" text-anchor="start" fill="#7b7c55">Gemma 4 12B</text>
<text x="554" y="72" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">40 ms of 16 kHz audio =</text>
<text x="554" y="88" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">640 numbers, projected directly</text>
<text x="554" y="128" font-size="14" font-weight="700" text-anchor="start" fill="#7b7c55">Inkling</text>
<text x="554" y="146" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">dMel spectrogram →</text>
<text x="554" y="162" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d">light-weight embedding layer</text>
<path d="M 30 300 L 750 300" fill="none" stroke="#977a5d" stroke-width="1.4" stroke-opacity="1" marker-end="url(#ah-977a5d)"/>
<path d="M 750 300 L 30 300" fill="none" stroke="#977a5d" stroke-width="1.4" stroke-opacity="1" marker-end="url(#ah-977a5d)"/>
<text x="30" y="322" font-size="12" font-weight="600" text-anchor="start" fill="#977a5d">reuses more outside knowledge</text>
<text x="750" y="322" font-size="12" font-weight="600" text-anchor="end" fill="#977a5d">fewer fixed choices about the input</text>
</svg>
