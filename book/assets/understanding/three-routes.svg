<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 788 308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Three ways to hand music to an LLM</title>
<desc id="d">The same reel enters an LLM by three routes. Audio goes through an audio encoder and an adapter, about 25 tokens per second in Qwen2-Audio. A score image goes through an image encoder or patch projection and an adapter, as in any vision-language model. Text such as ABC notation needs only the tokenizer, so any text LLM can read it. All three routes end in the same decoder-only LLM, which writes the answer as text.</desc>
