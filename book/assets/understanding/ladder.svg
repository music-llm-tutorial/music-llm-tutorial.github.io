<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 788 308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The benchmark ladder</title>
<desc id="d">Four rising steps, labelled by who writes and can answer the questions. Grade school: GSM8K, and GSM1k, a fresh copy on which accuracy drops of up to 8% appear. College: CSyMR draws on college-level music theory exams and r/musictheory. Graduate level: GPQA, 448 questions on which experts reach 65% and skilled non-experts with web access 34%; Humanity's Last Exam, 2,500 questions; FrontierMath, under 2% solved at release. The top step, drawn dashed, is master-level music: questions only expert performers, composers and analysts can write and grade.</desc>
