<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 788 308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Self-attention versus gated cross-attention</title>
<desc id="d">Left: music tokens sit in the LLM's input sequence before the text tokens, and every layer's self-attention lets text tokens attend to them, as in LLaVA, LLark and Qwen2-Audio. Right: only text tokens are in the sequence. New gated cross-attention layers between frozen LLM layers read the audio features; each multiplies its output by tanh of a learned scalar that starts at zero, so training starts from the unchanged LLM. Flamingo and Audio Flamingo 1 and 2 use this design.</desc>
