<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 788 258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The shared recipe</title>
<desc id="d">Four steps shared by audio and image routes. Encode: an optional fixed pre-transform such as a spectrogram, then a learned encoder that outputs continuous vectors or discrete codes, or no encoder at all. Adapt: map vectors to the LLM's embedding size with a projection or a Q-Former, or give each discrete code a new row in the LLM's embedding table. Position: put the music tokens in the LLM's input as a prefix, interleaved with text, or read them through cross-attention. Train: next-token loss on the text answer. Training usually runs in stages: align on captions, instruction-tune on questions and answers, and optionally reinforcement learning with verifiable rewards.</desc>
<style>@media (prefers-color-scheme: dark) {
[fill="#977a5d"] { fill: #a99178 } [stroke="#977a5d"] { stroke: #a99178 }
[fill="#607b9a"] { fill: #8297af } [stroke="#607b9a"] { stroke: #8297af }
[fill="#ab7827"] { fill: #d9aa57 } [stroke="#ab7827"] { stroke: #d9aa57 }
[fill="#7b7c55"], [fill="#8f9066"] { fill: #6f9363 } [stroke="#8f9066"] { stroke: #6f9363 }
[fill-opacity="0.14"] { fill-opacity: 0.2 }
}</style>
<defs><marker id="ah-607b9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607b9a"/></marker><marker id="ah-8f9066" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f9066"/></marker><marker id="ah-977a5d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#977a5d"/></marker><marker id="ah-ab7827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ab7827"/></marker></defs>
<rect x="0" y="0" width="172" height="130" rx="10" fill="#607b9a" fill-opacity="0.1" stroke="#607b9a" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="14" y="26" font-size="15" font-weight="700" text-anchor="start" fill="#607b9a">1  Encode</text>
<text x="14" y="52" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">optional pre-transform</text>
<text x="14" y="70" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">(e.g. mel), then a</text>
<text x="14" y="88" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">learned encoder →</text>
<text x="14" y="106" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">vectors or codes</text>
<line x1="175" y1="65" x2="199" y2="65" stroke="#607b9a" stroke-width="1.6" stroke-opacity="1" marker-end="url(#ah-607b9a)"/>
<rect x="202" y="0" width="172" height="130" rx="10" fill="#ab7827" fill-opacity="0.1" stroke="#ab7827" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="216" y="26" font-size="15" font-weight="700" text-anchor="start" fill="#ab7827">2  Adapt</text>
<text x="216" y="52" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">into the LLM's</text>
<text x="216" y="70" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">embedding space:</text>
<text x="216" y="88" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">projection, Q-Former,</text>
<text x="216" y="106" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">or new token rows</text>
<line x1="377" y1="65" x2="401" y2="65" stroke="#ab7827" stroke-width="1.6" stroke-opacity="1" marker-end="url(#ah-ab7827)"/>
<rect x="404" y="0" width="172" height="130" rx="10" fill="#8f9066" fill-opacity="0.1" stroke="#8f9066" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="418" y="26" font-size="15" font-weight="700" text-anchor="start" fill="#7b7c55">3  Position</text>
<text x="418" y="52" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">music tokens in the</text>
<text x="418" y="70" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">input: prefix,</text>
<text x="418" y="88" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">interleaved, or</text>
<text x="418" y="106" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">cross-attention</text>
<line x1="579" y1="65" x2="603" y2="65" stroke="#8f9066" stroke-width="1.6" stroke-opacity="1" marker-end="url(#ah-8f9066)"/>
<rect x="606" y="0" width="172" height="130" rx="10" fill="#977a5d" fill-opacity="0.1" stroke="#977a5d" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="620" y="26" font-size="15" font-weight="700" text-anchor="start" fill="#977a5d">4  Train</text>
<text x="620" y="52" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">next-token loss</text>
<text x="620" y="70" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">on the text answer</text>
<text x="0" y="172" font-size="13" font-weight="700" text-anchor="start" fill="#977a5d">Training stages</text>
<rect x="120" y="150" width="195" height="54" rx="8" fill="#977a5d" fill-opacity="0.05" stroke="#977a5d" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="217" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#977a5d">align</text>
<text x="217" y="192" font-size="12" font-weight="400" text-anchor="middle" fill="#977a5d">audio captions</text>
<line x1="318" y1="177" x2="342" y2="177" stroke="#977a5d" stroke-width="1.6" stroke-opacity="1" marker-end="url(#ah-977a5d)"/>
<rect x="345" y="150" width="195" height="54" rx="8" fill="#977a5d" fill-opacity="0.05" stroke="#977a5d" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="442" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#977a5d">instruction-tune</text>
<text x="442" y="192" font-size="12" font-weight="400" text-anchor="middle" fill="#977a5d">questions and answers</text>
<line x1="543" y1="177" x2="567" y2="177" stroke="#977a5d" stroke-width="1.6" stroke-opacity="1" marker-end="url(#ah-977a5d)"/>
<rect x="570" y="150" width="195" height="54" rx="8" fill="#977a5d" fill-opacity="0.05" stroke="#977a5d" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="667" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#977a5d">RL (optional)</text>
<text x="667" y="192" font-size="12" font-weight="400" text-anchor="middle" fill="#977a5d">verifiable rewards</text>
<text x="120" y="236" font-size="12" font-weight="400" text-anchor="start" fill="#977a5d" font-style="italic">The encoder and the LLM are often frozen in the first stage; later stages may unfreeze them.</text>
</svg>
