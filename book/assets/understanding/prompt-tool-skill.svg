<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 788 278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Prompt, tool, or skill</title>
<desc id="d">Three ways to give an LLM symbolic music. Prompt only: the question and the **kern score go into the prompt and the LLM answers from the tokens. Tool call: the LLM calls a music21 function, for example a key analysis that returns D major, and combines the results; CSyMR pairs music21 tools with a ReAct loop. Skill: a written procedure, distilled from a music-theory textbook into a skill graph, is retrieved into the prompt and the LLM follows its steps without tools; this is SymSkill.</desc>
<style>@media (prefers-color-scheme: dark) {
[fill="#977a5d"] { fill: #a99178 } [stroke="#977a5d"] { stroke: #a99178 }
[fill="#607b9a"] { fill: #8297af } [stroke="#607b9a"] { stroke: #8297af }
[fill="#ab7827"] { fill: #d9aa57 } [stroke="#ab7827"] { stroke: #d9aa57 }
[fill="#7b7c55"], [fill="#8f9066"] { fill: #6f9363 } [stroke="#8f9066"] { stroke: #6f9363 }
[fill-opacity="0.14"] { fill-opacity: 0.2 }
}</style>
<defs><marker id="ah-607b9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607b9a"/></marker><marker id="ah-8f9066" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f9066"/></marker><marker id="ah-977a5d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#977a5d"/></marker><marker id="ah-ab7827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ab7827"/></marker></defs>
<rect x="0" y="0" width="240" height="250" rx="10" fill="#977a5d" fill-opacity="0.08" stroke="#977a5d" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="16" y="28" font-size="16" font-weight="700" text-anchor="start" fill="#977a5d">Prompt only</text>
<rect x="14" y="44" width="212" height="64" rx="6" fill="#977a5d" fill-opacity="0.1" stroke="#977a5d" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="26" y="70" font-size="13" font-weight="500" text-anchor="start" fill="#977a5d" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">question + **kern</text>
<text x="26" y="92" font-size="13" font-weight="500" text-anchor="start" fill="#977a5d" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ LLM → answer</text>
<text x="16" y="140" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">The model works out the</text>
<text x="16" y="160" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">analysis from the tokens,</text>
<text x="16" y="180" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">in one pass or in its</text>
<text x="16" y="200" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">own reasoning.</text>
<rect x="270" y="0" width="240" height="250" rx="10" fill="#607b9a" fill-opacity="0.08" stroke="#607b9a" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="286" y="28" font-size="16" font-weight="700" text-anchor="start" fill="#607b9a">Tool call</text>
<rect x="284" y="44" width="212" height="64" rx="6" fill="#607b9a" fill-opacity="0.1" stroke="#607b9a" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="296" y="70" font-size="13" font-weight="500" text-anchor="start" fill="#607b9a" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LLM → analyze('key')</text>
<text x="296" y="92" font-size="13" font-weight="500" text-anchor="start" fill="#607b9a" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">← 'D major' → LLM</text>
<text x="286" y="140" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">A library computes the</text>
<text x="286" y="160" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">facts; the model chooses</text>
<text x="286" y="180" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">the calls and combines</text>
<text x="286" y="200" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">the results (CSyMR).</text>
<rect x="540" y="0" width="240" height="250" rx="10" fill="#8f9066" fill-opacity="0.08" stroke="#8f9066" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="556" y="28" font-size="16" font-weight="700" text-anchor="start" fill="#7b7c55">Skill</text>
<rect x="554" y="44" width="212" height="64" rx="6" fill="#8f9066" fill-opacity="0.1" stroke="#8f9066" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="566" y="70" font-size="13" font-weight="500" text-anchor="start" fill="#7b7c55" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">retrieve a procedure</text>
<text x="566" y="92" font-size="13" font-weight="500" text-anchor="start" fill="#7b7c55" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ follow its steps</text>
<text x="556" y="140" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">Steps distilled from a</text>
<text x="556" y="160" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">theory textbook sit in</text>
<text x="556" y="180" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">the prompt; no tools at</text>
<text x="556" y="200" font-size="13" font-weight="400" text-anchor="start" fill="#977a5d">inference (SymSkill).</text>
</svg>
