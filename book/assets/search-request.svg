<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 786 360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What a request contains, and who could read it</title>
<desc id="d">Top: user 1024's query, 'Something for a late-night drive in the rain, no vocals, and not too old', and profile (female, aged 25 to 34, favorites Bill Evans and Nils Frahm, 10 recent plays and 1 skip). Below, a matrix of four kinds of information against four systems. Situation ('late-night drive in the rain'): tag retrieval does not read it, a joint audio-text embedding reads it loosely, collaborative filtering does not, conversational recommendation does. Constraints ('no vocals', 'not too old'): tags read them partly, the embedding does not, collaborative filtering does not, the LLM does. Taste (Bill Evans, Nils Frahm): only collaborative filtering reads it partly, and the LLM reads it. Behavior (this listener's plays and everyone else's logs): collaborative filtering reads it; the LLM reads it partly, since it can read this listener's history as text but not the logs of millions of others.</desc>
<text x="0" y="14" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">QUERY</text>
<rect x="0.8" y="26.75" width="470" height="62" rx="8" fill="#ab7827" fill-opacity="0.12" stroke="#ab7827" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="16" y="52" font-size="13.5" font-style="italic" fill="#ab7827">“Something for a late-night drive in the rain,</text>
<text x="16" y="72" font-size="13.5" font-style="italic" fill="#ab7827">no vocals, and not too old.”</text>
<text x="490" y="14" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">USER</text>
<rect x="490.8" y="26.75" width="280" height="62" rx="8" fill="#9a6a8f" fill-opacity="0.12" stroke="#9a6a8f" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="506" y="46" font-size="12" font-weight="700" fill="#9a6a8f">ID 1024 · female · 25–34</text>
<text x="506" y="63" font-size="12" fill="#9a6a8f">favorites: Bill Evans, Nils Frahm</text>
<text x="506" y="79" font-size="12" fill="#9a6a8f">history: 10 recent plays, 1 skip</text>
<text x="0" y="126" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">KIND</text>
<text x="112" y="126" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">IN USER 1024’S REQUEST</text>
<rect x="668" y="102" width="106" height="224" rx="6" fill="#ab7827" fill-opacity="0.08"/>
<text x="452" y="118" font-size="11.5" font-weight="700" text-anchor="middle" fill="#977a5d">Tag</text>
<text x="452" y="132" font-size="11.5" font-weight="700" text-anchor="middle" fill="#977a5d">retrieval</text>
<text x="540" y="118" font-size="11.5" font-weight="700" text-anchor="middle" fill="#977a5d">Joint audio–</text>
<text x="540" y="132" font-size="11.5" font-weight="700" text-anchor="middle" fill="#977a5d">text embedding</text>
<text x="632" y="118" font-size="11.5" font-weight="700" text-anchor="middle" fill="#977a5d">Collaborative</text>
<text x="632" y="132" font-size="11.5" font-weight="700" text-anchor="middle" fill="#977a5d">filtering</text>
<text x="722" y="118" font-size="11.5" font-weight="700" text-anchor="middle" fill="#977a5d">Conversational</text>
<text x="722" y="132" font-size="11.5" font-weight="700" text-anchor="middle" fill="#977a5d">recommendation</text>
<line x1="0" y1="146" x2="770" y2="146" stroke="#977a5d" stroke-width="0.8" stroke-opacity="0.35"/>
<rect x="0" y="155" width="96" height="24" rx="5" fill="#ab7827" fill-opacity="0.2" stroke="#ab7827" stroke-opacity="0.6" stroke-width="1"/>
<text x="48" y="171.32" font-size="12" text-anchor="middle" fill="#ab7827">Situation</text>
<text x="112" y="165" font-size="12.5" font-style="italic" fill="#3d3a35">“late-night drive in the rain”</text>
<text x="112" y="181" font-size="11.5" fill="#77726a">implies a sound without naming one</text>
