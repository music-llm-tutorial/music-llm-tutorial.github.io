<text x="112" y="297" font-size="12.5" font-style="italic" fill="#3d3a35">her plays and skips; everyone else’s logs</text>
<text x="112" y="313" font-size="11.5" fill="#77726a">who listened to what</text>
<circle cx="452" cy="299" r="6.5" fill="none" stroke="#607b9a" stroke-opacity="0.6" stroke-width="1.5"/>
<circle cx="540" cy="299" r="6.5" fill="none" stroke="#607b9a" stroke-opacity="0.6" stroke-width="1.5"/>
<circle cx="632" cy="299" r="6.5" fill="#607b9a"/>
<circle cx="722" cy="299" r="6.5" fill="none" stroke="#ab7827" stroke-width="1.5"/>
<path d="M722,292.5 A6.5,6.5 0 0 0 722,305.5 Z" fill="#ab7827"/>
<line x1="0" y1="322" x2="770" y2="322" stroke="#977a5d" stroke-width="0.8" stroke-opacity="0.35"/>
<circle cx="6" cy="340" r="6.5" fill="#77726a"/>
<text x="18" y="344" font-size="12" fill="#77726a">reads it</text>
<circle cx="86" cy="340" r="6.5" fill="none" stroke="#77726a" stroke-width="1.5"/>
<path d="M86,333.5 A6.5,6.5 0 0 0 86,346.5 Z" fill="#77726a"/>
<text x="98" y="344" font-size="12" fill="#77726a">reads it partly</text>
<circle cx="202" cy="340" r="6.5" fill="none" stroke="#77726a" stroke-opacity="0.6" stroke-width="1.5"/>
<text x="214" y="344" font-size="12" fill="#77726a">does not</text>
<text x="770" y="344" font-size="11.5" font-style="italic" text-anchor="end" fill="#77726a">The LLM reads this listener’s plays as text, not the logs of millions of others.</text>
