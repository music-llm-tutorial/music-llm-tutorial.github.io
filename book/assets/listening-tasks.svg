<title id="t">Annotation, search/retrieval, and recommendation</title>
<desc id="d">Three columns, one per task. Annotation maps music, an audio track, to information: tags, captions, and fields. Search/retrieval maps a query, "late-night drive in the rain, no vocals, not too old", to music, the tracks that match it. Recommendation maps a user (ID 1024, female, aged 25–34, favorites Bill Evans and Nils Frahm) to music, the next track for that user.</desc>
