<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 786 330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What listening evaluation should score</title>
<desc id="d">Left, what benchmarks score. Held-out next track: the logs say user 1024 played track 0517 next; the metric asks whether 0517 is in the list (hit at 10). Caption as query: 'A slow piano trio with brushed drums' is the query; the metric asks whether the captioned track is retrieved (recall at 10). Neither looks at the request, the revision, or the reason. Right, what a listening evaluation should score, over two turns. Turn 1: the request returns 0381, 0644, and 0207; check 1, constraint satisfaction: every track has no vocals and a year of 2015 or later. Turn 2: 'more upbeat' returns 0702 and 0815; check 2, the revision is handled as a revision: tempo goes up from 72 to 118 bpm while vocals and year stay fixed. The reason, '#0702: 2021, piano and drums, no vocals, 118 bpm'; check 3, the reason cites fields the ranker actually read. None of the three needs the held-out track.</desc>
