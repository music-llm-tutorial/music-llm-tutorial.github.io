<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 786 376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The LLM as reranker</title>
<desc id="d">Top row: user 1024's request ('late-night drive in the rain, no vocals, not too old', favorites Bill Evans and Nils Frahm) goes to an LLM that rewrites it into a text query, 'slow, sparse piano, nocturnal', and a filter, vocals = none and year at least 2015. These go to a text-to-music retriever, which scores audio, and a metadata filter over the record. Middle: five candidates with their records and retriever scores. Lo-fi track 0207 (2021, no vocals, chill, Rhodes and drum machine) scores 0.82; dream-pop track 0930 (2022, vocals) scores 0.80 and is removed by the filter; jazz track 0381 (2019, no vocals, nocturnal, piano trio) scores 0.79; jazz track 0112 (1959) scores 0.77 and is removed by the year filter; ambient track 0644 (2017, no vocals, calm, solo piano) scores 0.74. The LLM reranks the survivors by reading their rows and the profile: 0381 first, 0644 second, 0207 third. Bottom: the answer with its reason, and a note that the LLM never hears the audio.</desc>
