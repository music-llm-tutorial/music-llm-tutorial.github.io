<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 786 360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Audio-text LLMs versus supervised models on CMI-Bench</title>
<desc id="d">Dumbbell chart, one row per task, score on each task's own metric from 0 to 100. Open output: captioning (MusicCaps, METEOR) LLM 22.5, supervised 22.4. Categories: tagging (MagnaTagATune, ROC-AUC) 81.2 vs 92.0; genre (GTZAN, accuracy) 72.1 vs 83.9; instrument (NSynth, accuracy) 58.4 vs 78.2. Measurements: key (GiantSteps, weighted score) 9.5 vs 74.3; beat (GTZAN-Rhythm, F-measure) 23.7 vs 88.3. Data from CMI-Bench.</desc>
