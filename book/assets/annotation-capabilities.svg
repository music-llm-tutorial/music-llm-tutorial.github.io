<text x="15" y="130" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#607b9a">INSTRUCTION</text>
<text x="15" y="151" font-size="13" fill="#607b9a">“Add mood and</text>
<text x="15" y="168" font-size="13" fill="#607b9a">instruments, then</text>
<text x="15" y="185" font-size="13" fill="#607b9a">write a caption.”</text>
