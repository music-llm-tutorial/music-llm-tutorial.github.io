<rect x="222.8" y="70.75" width="112" height="28" rx="6" fill="#977a5d" fill-opacity="0.06" stroke="#977a5d" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="278.8" y="89" font-size="12" text-anchor="middle" fill="#977a5d">adapter</text>
<rect x="222.8" y="118.75" width="230" height="76" rx="8" fill="#977a5d" fill-opacity="0.1" stroke="#977a5d" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="337.8" y="152" font-size="16" font-weight="700" text-anchor="middle" fill="#977a5d">LLM</text>
<text x="337.8" y="172" font-size="11.5" text-anchor="middle" fill="#977a5d">audio tokens + text tokens</text>
