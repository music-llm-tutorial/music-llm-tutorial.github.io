<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 786 336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Three LLM capabilities behind music annotation</title>
<desc id="d">Music passes through an audio encoder and an adapter into an LLM, which also reads an instruction: add mood and instruments, then write a caption. The LLM writes its answer one token at a time: mood nocturnal, instruments piano trio, and a caption beginning 'A sparse piano trio'. Three tags mark the capabilities: (1) multimodal understanding at the encoder and adapter, which turn music into tokens the LLM reads like text; (2) autoregressive generation at the output, which produces a label, a field, or a sentence the same way; (3) multitask at the instruction, which names the task so one model serves many annotation tasks.</desc>
<text x="0" y="14" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">INPUT</text>
<text x="222" y="14" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">MODEL</text>
<text x="492" y="14" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">OUTPUT · ONE TOKEN AT A TIME</text>
<rect x="0.8" y="26.75" width="190" height="64" rx="8" fill="#8f9066" fill-opacity="0.12" stroke="#8f9066" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="15" y="46" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#8f9066">MUSIC</text>
