<text x="9" y="260" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="24" y="260" font-size="13" font-weight="700" fill="#3d3a35">Multimodal understanding</text>
<text x="0" y="282" font-size="12.5" fill="#77726a">An audio encoder and adapter</text>
<text x="0" y="299" font-size="12.5" fill="#77726a">turn music into tokens the</text>
<text x="0" y="316" font-size="12.5" fill="#77726a">LLM reads like text.</text>
<line x1="262" y1="236" x2="506" y2="236" stroke="#ab7827" stroke-opacity="0.5" stroke-width="1"/>
<circle cx="271" cy="256" r="9" fill="#ab7827" fill-opacity="0.9"/>
<text x="271" y="260" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="286" y="260" font-size="13" font-weight="700" fill="#3d3a35">Autoregressive generation</text>
<text x="262" y="282" font-size="12.5" fill="#77726a">The output is a token sequence,</text>
<text x="262" y="299" font-size="12.5" fill="#77726a">so a label, a field, or a sentence</text>
<text x="262" y="316" font-size="12.5" fill="#77726a">is produced the same way.</text>
<line x1="524" y1="236" x2="768" y2="236" stroke="#ab7827" stroke-opacity="0.5" stroke-width="1"/>
<circle cx="533" cy="256" r="9" fill="#ab7827" fill-opacity="0.9"/>
<text x="533" y="260" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="548" y="260" font-size="13" font-weight="700" fill="#3d3a35">Multitask</text>
<text x="524" y="282" font-size="12.5" fill="#77726a">The instruction names the task,</text>
<text x="524" y="299" font-size="12.5" fill="#77726a">so one model serves many</text>
<text x="524" y="316" font-size="12.5" fill="#77726a">annotation tasks at once.</text>
</svg>
