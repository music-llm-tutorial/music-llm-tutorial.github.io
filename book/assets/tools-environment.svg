<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 786 346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The tool environment</title>
<desc id="d">Two sources of data, the catalog of 6,761 tracks (metadata, tags, lyrics, tempo and key, audio, cover art) and the listening logs, are turned in advance into five kinds of index: a SQL table, BM25 indices over five text fields, embeddings of six views of each track, listener vectors from collaborative filtering, and semantic IDs of four codes per view. Six tools read these indices: sql, bm25, text_to_item_similarity, item_to_item_similarity, user_to_item_similarity and semantic_id_matching. Every tool searches only the current pool of candidates.</desc>
<text x="0" y="14" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">DATA</text>
<rect x="0.8" y="26.75" width="170" height="190" rx="8" fill="#ab7827" fill-opacity="0.12" stroke="#ab7827" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="16" y="50" font-size="12" font-weight="700" fill="#ab7827">Catalog</text>
<text x="16" y="68" font-size="12" fill="#ab7827">6,761 tracks</text>
<text x="16" y="92" font-size="11" font-family="Menlo, Consolas, monospace" fill="#ab7827">metadata, tags</text>
<text x="16" y="110" font-size="11" font-family="Menlo, Consolas, monospace" fill="#ab7827">lyrics</text>
<text x="16" y="128" font-size="11" font-family="Menlo, Consolas, monospace" fill="#ab7827">tempo, key</text>
<text x="16" y="146" font-size="11" font-family="Menlo, Consolas, monospace" fill="#ab7827">audio, cover art</text>
<rect x="0.8" y="226.75" width="170" height="50" rx="8" fill="#ab7827" fill-opacity="0.12" stroke="#ab7827" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="16" y="247" font-size="12" font-weight="700" fill="#ab7827">Listening logs</text>
<text x="16" y="265" font-size="11" font-family="Menlo, Consolas, monospace" fill="#ab7827">18,090 listeners</text>
<text x="212" y="14" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">COMPUTED IN ADVANCE</text>
<rect x="212.8" y="26.75" width="290" height="40" rx="8" fill="#607b9a" fill-opacity="0.12" stroke="#607b9a" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="228" y="43.75" font-size="12" font-weight="700" fill="#607b9a">SQL table</text>
<text x="228" y="58.75" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#607b9a">title, artist, album, year, tempo, key</text>
<rect x="212.8" y="76.75" width="290" height="40" rx="8" fill="#607b9a" fill-opacity="0.12" stroke="#607b9a" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="228" y="93.75" font-size="12" font-weight="700" fill="#607b9a">BM25</text>
<text x="228" y="108.75" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#607b9a">title · artist · album · lyrics · tags</text>
<rect x="212.8" y="126.75" width="290" height="40" rx="8" fill="#607b9a" fill-opacity="0.12" stroke="#607b9a" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="228" y="143.75" font-size="12" font-weight="700" fill="#607b9a">Embeddings</text>
<text x="228" y="158.75" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#607b9a">text 1024 · audio 512 · image 768 · cf 128</text>
<rect x="212.8" y="176.75" width="290" height="40" rx="8" fill="#607b9a" fill-opacity="0.12" stroke="#607b9a" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="228" y="193.75" font-size="12" font-weight="700" fill="#607b9a">Semantic IDs</text>
<text x="228" y="208.75" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#607b9a">embeddings quantized to 4 codes</text>
<rect x="212.8" y="226.75" width="290" height="40" rx="8" fill="#607b9a" fill-opacity="0.12" stroke="#607b9a" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="228" y="243.75" font-size="12" font-weight="700" fill="#607b9a">Listener vectors</text>
<text x="228" y="258.75" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#607b9a">collaborative filtering, 128</text>
