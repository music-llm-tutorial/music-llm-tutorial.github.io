<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 786 351" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">One model per column versus one model for many columns</title>
<desc id="d">Top, previous approaches: a genre classifier, an instrument classifier, and a captioner, three models trained on three datasets, each fill one column of the database (genre jazz, instruments piano trio, caption 'A sparse piano trio, brushed drums.'). Bottom, with an LLM: three instructions (What is the genre? List the instruments. Write a caption.) go into one audio-language LLM, which fills the same three columns.</desc>
