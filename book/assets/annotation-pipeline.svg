<title id="t">Measure first, then write</title>
<desc id="d">Stage 1, measure: supervised MIR models read the music and produce tempo, key, and beat; the catalog supplies genre and year. Stage 2, store: both go into the database row for track 0381 (jazz, 2019, 72 bpm, D-flat major). Stage 3, write: an audio-language LLM reads the audio and the row as context and writes the caption 'A slow piano trio in D-flat major, 72 bpm, brushed drums, unhurried and nocturnal.' Cells are colored by source: MIR models, catalog, or LLM.</desc>
