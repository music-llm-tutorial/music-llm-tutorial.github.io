<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 786 298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Captioning and metadata imputation as sequence modeling</title>
<desc id="d">Two rows of tokens. Captioning: given an audio chip and the instruction 'Write a caption.', the model generates 'A sparse piano trio, brushed drums.' one token at a time, each conditioned on the ones before: p(caption | audio, instruction). Metadata imputation: the database row is written out as tokens, genre jazz and year 2019 given as context, and the model generates the missing values, mood nocturnal and instruments piano trio: p(missing fields | audio, known fields). The completed row goes back into the database with the generated cells highlighted.</desc>
