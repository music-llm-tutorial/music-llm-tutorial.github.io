<polyline points="127,255 160,255 160,244" fill="none" stroke="#977a5d" stroke-width="1.5"/>
<rect x="16" y="268" width="110" height="18" rx="5" fill="#607b9a" fill-opacity="0.15" stroke="#607b9a" stroke-opacity="0.6" stroke-width="1"/>
<text x="71" y="280.96" font-size="11" text-anchor="middle" fill="#3d3a35">CF embedding</text>
<polyline points="127,277 160,277 160,244" fill="none" stroke="#977a5d" stroke-width="1.5"/>
<line x1="160" y1="244" x2="214" y2="244" stroke="#977a5d" stroke-width="1.5"/>
<path d="M208,240.35 L214,244 L208,247.65" fill="none" stroke="#977a5d" stroke-width="1.5"/>
<rect x="216" y="232" width="70" height="24" rx="5" fill="#607b9a" fill-opacity="0.28" stroke="#607b9a" stroke-opacity="0.6" stroke-width="1"/>
<text x="251" y="248.32" font-size="12" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#3d3a35">‹0381›</text>
<text x="298" y="240" font-size="11.5" font-style="italic" fill="#77726a">one token,</text>
<text x="298" y="256" font-size="11.5" font-style="italic" fill="#77726a">all four signals</text>
<text x="424" y="176" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">THE CATALOG IS THE VOCABULARY</text>
