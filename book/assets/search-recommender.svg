<rect x="439.08" y="116" width="36.64" height="24" rx="5" fill="#ab7827" fill-opacity="0.28" stroke="#ab7827" stroke-opacity="0.6" stroke-width="1"/>
<text x="457.4" y="132.32" font-size="12" text-anchor="middle" fill="#3d3a35">Nils</text>
<rect x="480.72" y="116" width="56.68" height="24" rx="5" fill="#ab7827" fill-opacity="0.28" stroke="#ab7827" stroke-opacity="0.6" stroke-width="1"/>
<text x="509.06" y="132.32" font-size="12" text-anchor="middle" fill="#3d3a35">Frahm.</text>
<text x="550.4" y="126" font-size="11.5" font-style="italic" fill="#77726a">tracks and the reason,</text>
<text x="550.4" y="141" font-size="11.5" font-style="italic" fill="#77726a">in one stream</text>
<text x="0" y="176" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">WHERE A TRACK TOKEN COMES FROM</text>
