<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 786 304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The LLM as recommender</title>
<desc id="d">Top, generative recommendation as sequence modeling, p(next tracks | user, history, request). The context is given: the user token for user 1024, three track tokens from her history (0112, 0927, and 0458, which she skipped), and the request 'late-night drive in the rain, no vocals, not too old'. The model generates track tokens 0381 and 0644 and a response, 'Slow piano after 2015, like your Nils Frahm.' Bottom left, where a track token comes from: audio, lyrics, metadata, and a collaborative-filtering embedding are combined into one token for track 0381. Bottom right, the catalog is the vocabulary: every track the model can name is a token learned in training, and a track released today is not a token until the model is retrained.</desc>
<text x="0" y="14" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">GENERATIVE RECOMMENDATION</text>
<text x="0" y="34" font-size="12" font-style="italic" fill="#77726a">p(next tracks | user, history, request)</text>
<rect x="560" y="4" width="14" height="12" rx="3" fill="#77726a" fill-opacity="0.12" stroke="#77726a" stroke-opacity="0.6"/>
<text x="580" y="14.5" font-size="12" fill="#77726a">given (context)</text>
<rect x="672" y="4" width="14" height="12" rx="3" fill="#ab7827" fill-opacity="0.28" stroke="#ab7827" stroke-opacity="0.6"/>
<text x="692" y="14.5" font-size="12" fill="#77726a">generated</text>
<rect x="0" y="58" width="82" height="24" rx="5" fill="#9a6a8f" fill-opacity="0.15" stroke="#9a6a8f" stroke-opacity="0.6" stroke-width="1"/>
<text x="41" y="74.32" font-size="12" text-anchor="middle" fill="#3d3a35">user 1024</text>
<rect x="88" y="58" width="58" height="24" rx="5" fill="#607b9a" fill-opacity="0.15" stroke="#607b9a" stroke-opacity="0.6" stroke-width="1"/>
<text x="117" y="74.14" font-size="11.5" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#3d3a35">‹0112›</text>
<rect x="152" y="58" width="58" height="24" rx="5" fill="#607b9a" fill-opacity="0.15" stroke="#607b9a" stroke-opacity="0.6" stroke-width="1"/>
<text x="181" y="74.14" font-size="11.5" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#3d3a35">‹0927›</text>
<rect x="216" y="58" width="58" height="24" rx="5" fill="#607b9a" fill-opacity="0.15" stroke="#607b9a" stroke-opacity="0.6" stroke-width="1"/>
<text x="245" y="74.14" font-size="11.5" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#3d3a35">‹0458›</text>
<text x="245" y="96" font-size="10.5" font-style="italic" text-anchor="middle" fill="#77726a">skipped</text>
<text x="282" y="74" font-size="13" fill="#77726a">…</text>
<rect x="302" y="58" width="293.68" height="24" rx="5" fill="#77726a" fill-opacity="0.08" stroke="#77726a" stroke-opacity="0.6" stroke-width="1"/>
<text x="448.84" y="74.32" font-size="12" font-style="italic" text-anchor="middle" fill="#3d3a35">late-night drive in the rain, no vocals, not too old</text>
<text x="0" y="132" font-size="14" fill="#ab7827">→</text>
<rect x="22" y="116" width="58" height="24" rx="5" fill="#ab7827" fill-opacity="0.28" stroke="#ab7827" stroke-opacity="0.6" stroke-width="1"/>
<text x="51" y="132.14" font-size="11.5" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#3d3a35">‹0381›</text>
<rect x="86" y="116" width="58" height="24" rx="5" fill="#ab7827" fill-opacity="0.28" stroke="#ab7827" stroke-opacity="0.6" stroke-width="1"/>
<text x="115" y="132.14" font-size="11.5" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#3d3a35">‹0644›</text>
