<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 778 273" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Supervised fine-tuning on a chat template</title>
<desc id="d">A two-turn conversation written as one token sequence in one open model family's chat template. System and user turns, and the assistant role headers, are context: the model reads them but gets no loss on them. The assistant replies 'D–Bm–G–A' and 'D major', each with its end-of-turn token &lt;|im_end|&gt;, are trained with the next-token loss.</desc>
