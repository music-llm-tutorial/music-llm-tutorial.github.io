<path d="M 225 33.2 L 410 42.5 L 410 197.4 L 225 208.5 Z" fill="#607b9a" fill-opacity="0.18" stroke="#607b9a" stroke-opacity="0.55" stroke-width="1.5"/>
<path d="M 410 42.5 L 600 52.0 L 600 186.0 L 410 197.4 Z" fill="#ab7827" fill-opacity="0.12" stroke="#ab7827" stroke-opacity="0.55" stroke-width="1.5"/>
<line x1="410.0" y1="112.5" x2="600.0" y2="112.5" stroke="#ab7827" stroke-width="1" stroke-opacity="0.55"/>
<text x="112.5" y="98.0" font-size="16" font-weight="700" text-anchor="middle" fill="#607b9a">Pre-training</text>
<text x="112.5" y="119.0" font-size="13" font-weight="600" text-anchor="middle" fill="#607b9a">tens of trillions of tokens</text>
<text x="112.5" y="142.0" font-size="13" font-weight="400" text-anchor="middle" fill="#977a5d">web pages, books,</text>
<text x="112.5" y="159.0" font-size="13" font-weight="400" text-anchor="middle" fill="#977a5d">code, papers</text>
<text x="317.5" y="98.0" font-size="16" font-weight="700" text-anchor="middle" fill="#607b9a">Mid-training</text>
<text x="317.5" y="119.0" font-size="13" font-weight="600" text-anchor="middle" fill="#607b9a">up to a few trillion tokens</text>
<text x="317.5" y="142.0" font-size="13" font-weight="400" text-anchor="middle" fill="#977a5d">math, code, textbooks,</text>
<text x="317.5" y="159.0" font-size="13" font-weight="400" text-anchor="middle" fill="#977a5d">long documents</text>
<text x="505.0" y="73.2" font-size="16" font-weight="700" text-anchor="middle" fill="#ab7827">Post-training</text>
<text x="505.0" y="94.2" font-size="13" font-weight="600" text-anchor="middle" fill="#ab7827">millions of examples</text>
<text x="505.0" y="136.5" font-size="13" text-anchor="middle" xml:space="preserve"><tspan fill="#ab7827" font-weight="700">SFT</tspan><tspan fill="#977a5d" font-weight="400">: curated examples</tspan></text>
<text x="505.0" y="158.5" font-size="13" text-anchor="middle" xml:space="preserve"><tspan fill="#977a5d" font-weight="400">then </tspan><tspan fill="#ab7827" font-weight="700">RL</tspan><tspan fill="#977a5d" font-weight="400">: reward signals</tspan></text>
<line x1="410.0" y1="6.0" x2="410.0" y2="40.5" stroke="#607b9a" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="404.0" y="12.0" font-size="13" font-weight="700" text-anchor="end" fill="#607b9a">base model</text>
