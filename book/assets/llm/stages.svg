<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 778 270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Training stages</title>
<desc id="d">A funnel from left to right. Pre-training reads tens of trillions of tokens of web pages, books, code and papers. Mid-training reads up to a few trillion tokens of math, code, textbooks and long documents. Pre- and mid-training produce the base model. Post-training uses millions of examples: supervised fine-tuning on curated examples, then reinforcement learning on reward signals, and produces the instruct or reasoning model. Data shrinks and quality rises from left to right.</desc>
