<text x="640.0" y="132.0" font-size="14" font-weight="700" text-anchor="start" fill="#ab7827">reasoning model</text>
<line x1="8.0" y1="246.0" x2="596.0" y2="246.0" stroke="#977a5d" stroke-width="1.5" marker-end="url(#ah-977a5d)"/>
<text x="10.0" y="238.0" font-size="12" font-weight="600" text-anchor="start" fill="#977a5d">more data, noisier</text>
<text x="594.0" y="238.0" font-size="12" font-weight="600" text-anchor="end" fill="#977a5d">less data, higher quality</text>
</svg>
