<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 778 410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">A tool call as one token sequence</title>
<desc id="d">The token sequence for one tool call in one open model family's chat template, with the system prompt shortened. The system turn describes the get_tempo tool in JSON. The user asks for the tempo of track.wav. The assistant writes a tool call, &lt;tool_call&gt; with JSON naming get_tempo and the file, and ends its turn. The harness, your program, parses the call, runs get_tempo on the file, and inserts the result {"bpm": 124.0} as a new turn wrapped in &lt;tool_response&gt;. The assistant then answers 'It's about 124 BPM.' The tool call and the final answer are trained; the tool result is inserted by the harness and is context.</desc>
