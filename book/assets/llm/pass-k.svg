<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 778 308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">pass@k and pass^k</title>
<desc id="d">Line chart over k = 1 to 8 attempts for an agent that completes one task on 60% of its attempts, attempts independent. pass@k, the chance that at least one of k attempts succeeds, rises from 60% at k=1 to 84% at k=2 and 99.9% at k=8. pass^k, the chance that all k attempts succeed, falls from 60% at k=1 to 36% at k=2, 13% at k=4 and 1.7% at k=8.</desc>
