<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 778 316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Reinforcement learning on track descriptions</title>
<desc id="d">Prompt: an audio file funk.wav and the request 'Describe this track.' Song facts from annotations: funk, E minor, 104 BPM, 4/4, horns. The model writes three descriptions. A: 'Tight funk groove in E minor, 104 BPM in 4/4, with horns.' matches all five facts, reward 1.0. B: 'A funk track around 104 BPM with a synth bass line.' matches funk and tempo, reward 0.4. C: 'A laid-back jazz ballad in E major, led by piano.' matches none, reward 0.0. After the update, the probability of A rises from 0.30 to 0.45, B falls slightly from 0.40 to 0.36 because it is below the group mean of 0.47, and C falls from 0.30 to 0.19. Each description's advantage, its reward minus the mean, is +0.53, -0.07, and -0.47. Illustrative values.</desc>
