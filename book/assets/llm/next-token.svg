<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 778 308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Next-token prediction</title>
<desc id="d">The context 'In C major, G7 resolves to' is split into eight tokens and read by the LLM, a decoder-only Transformer in which each position sees itself and earlier positions. It outputs a probability for every token in its vocabulary: C 0.58, the 0.21, a 0.09, Am 0.03 (the deceptive resolution), all other tokens 0.09. Generation samples one token, appends it to the context, and predicts again. Token boundaries and probabilities are illustrative.</desc>
