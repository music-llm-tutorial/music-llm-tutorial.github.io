<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 802 444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Annotation, search/retrieval, and recommendation: what LLMs change</title>
<desc id="d">What LLMs change. On the left, annotation: an audio-language LLM takes an audio track and its metadata row, where genre (jazz) and year (2019) come for free and mood and instruments are empty, and a system prompt naming the columns to add ("write a caption; add mood and instruments"). It goes beyond tagging, writing a caption ("A sparse piano trio, brushed drums.") and imputing the new columns (mood nocturnal, instruments piano trio). The information is stored in a database table with columns track, genre, year, mood, and instruments; the mood and instruments cells are marked as added by the LLM. The table feeds the model on the right. On the right, search/retrieval and recommendation merge into conversational recommendation: the query ("late-night drive in the rain, no vocals, not too old") and the user (ID 1024, female, aged 25–34, favorites Bill Evans and Nils Frahm) both feed into one LLM or agent that maps (user, query) to music and a response. In the conversation it answers with slow piano tracks after 2015, close to the user's Nils Frahm plays; asked for something more upbeat, it swaps in brighter tracks that still have no vocals.</desc>
<text x="0.0" y="14" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#977a5d">ANNOTATION</text>
<text x="0.0" y="33" font-size="13" fill="#977a5d">captioning · metadata imputation</text>
