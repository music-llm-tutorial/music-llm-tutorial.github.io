<line x1="224" y1="245" x2="248" y2="245" stroke="#977a5d" stroke-width="1.5"/>
<path d="M242.0,248.6 L248,245 L242.0,241.4" fill="none" stroke="#977a5d" stroke-width="1.5"/>
<path d="M500,293 L500,318 L100,318 L100,300" fill="none" stroke="#977a5d" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="100" y1="305" x2="100" y2="294" stroke="#977a5d" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M103.6,300.0 L100,294 L96.4,300.0" fill="none" stroke="#977a5d" stroke-width="1.5"/>
<text x="300" y="336" font-size="11.5" font-style="italic" text-anchor="middle" fill="#77726a">both turns are appended to the memory for the next request</text>
