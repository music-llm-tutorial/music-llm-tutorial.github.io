version: 1

project:
  title: "LLMs × Music: Scalable Language Modeling Unlocks Music Applications"
  description: Online materials for the ISMIR tutorial on large language models and music applications
  github: https://github.com/music-llm-tutorial/music-llm-tutorial.github.io
  toc:
    - file: book/index.md
    - file: book/introduction/background.md
    - file: book/introduction/overview.md
    - title: Overview of Large Language Models and Agents
      children:
        - file: book/llm/foundations.md
        - file: book/llm/training.md
        - file: book/llm/capabilities.md
        - file: book/llm/evaluation.md
    - title: LLM-powered Music Understanding
      children:
        - file: book/understanding/overview.md
        - file: book/understanding/modalities.md
        - file: book/understanding/benchmarks.md
    - title: Music Listening
      children:
        - file: book/applications/listeners.md
    - title: Composition & Co-Creation
      children:
        - file: book/applications/producers.md
    - title: Feedback & Music Education
      children:
        - file: book/applications/performers.md
    - title: Conclusion
      children:
        - file: book/conclusion.md
    - title: References
      children:
        - file: book/references.md
  exclude:
    - README.md

site:
  template: book-theme
  title: LLMs × Music
  options:
    favicon: asset/favicon.svg
    logo: asset/logo-wordmark.png
    logo_alt: "ISMIR 2026: LLMs × Music"
    style: asset/custom.css
  actions:
    - title: GitHub
      url: https://github.com/music-llm-tutorial/music-llm-tutorial.github.io
