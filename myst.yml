version: 1

project:
  title: "LLMs × Music: Scalable Language Modeling Unlocks Music Applications"
  description: Online materials for the ISMIR tutorial on large language models and music applications
  thumbnail: asset/social-card.png
  github: https://github.com/music-llm-tutorial/music-llm-tutorial.github.io
  bibliography:
    - book/references.bib
  toc:
    - file: book/index.md
    - file: book/introduction/background.md
    - file: book/introduction/overview.md
    - title: Overview of Large Language Models and Agents
      children:
        - file: book/llm/foundations.md
        - file: book/llm/training.md
        - file: book/llm/capabilities.md
        - file: book/llm/evaluation.md
    - title: LLM-powered Music Understanding
      children:
        - file: book/understanding/overview.md
        - file: book/understanding/modalities.md
        - file: book/understanding/benchmarks.md
    - title: Music Listening
      children:
        - file: book/applications/listeners.md
    - title: Composition & Co-Creation
      children:
        - file: book/composers/00_overview.md
        - file: book/composers/01_prompt_to_artifact.md
        - file: book/composers/02_turn_based_cocreation.md
        - file: book/composers/03_realtime_performance.md
        - file: book/composers/04_agentic_musicmaking.md
        - file: book/composers/05_wrapup.md
    - title: Feedback & Music Education
      children:
        - file: book/performing/intro.md
        - file: book/performing/perceiving.md
          children:
            - file: book/performing/perceiving_score.md
            - file: book/performing/perceiving_audio.md
            - file: book/performing/perceiving_motion.md
        - file: book/performing/feedback.md
          children:
            - file: book/performing/feedback_language.md
            - file: book/performing/feedback_data.md
            - file: book/performing/feedback_demo.ipynb
        - file: book/performing/agentic.md
          children:
            - file: book/performing/agentic_tools.md
            - file: book/performing/agentic_memory.md
            - file: book/performing/agentic_pedagogy.md
            - file: book/performing/agentic_demo.ipynb
    - title: Conclusion
      children:
        - file: book/conclusion.md
    - title: References
      children:
        - file: book/references.md
  exclude:
    - README.md

site:
  template: book-theme
  title: LLMs × Music
  options:
    favicon: asset/favicon.ico
    logo: asset/logo-wordmark.png
    logo_alt: "ISMIR 2026: LLMs × Music"
    style: asset/custom.css
    numbered_references: true
  actions:
    - title: GitHub
      url: https://github.com/music-llm-tutorial/music-llm-tutorial.github.io
